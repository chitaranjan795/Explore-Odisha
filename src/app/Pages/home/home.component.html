<section class="hero">
    <h1> {{title}} </h1>
    <p> {{description}} </p>
    <button>Explore Districts</button>
</section>

<section class="district-section">
    <p>Explore Odisha</p>
    <h1>Journey by district</h1>

    <div class="district-grid">
        @for (district of districts; track district.name) {
        <app-districtcard [district]="district" />
        }
    </div>
</section>

<section class="category">
    <p class="text-sm ">Travel categories</p>
    <h1 class="mb-8 text-3xl font-semibold">
        What calls to you?
    </h1>

    <app-carousel />

</section>
