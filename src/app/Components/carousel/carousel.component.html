@if (slides().length > 0) {
<section class="relative h-screen min-h-[480px] w-full overflow-hidden bg-neutral-950 text-white"
    (mouseenter)="paused.set(true)" (mouseleave)="paused.set(false)" (focusin)="paused.set(true)"
    (focusout)="paused.set(false)" aria-roledescription="carousel" aria-label="Travel categories">
    <!-- Background images -->
    @for (slide of slides(); track slide.id; let i = $index) {
    <div class="absolute inset-0 bg-cover bg-center transition-all duration-700 ease-out motion-reduce:transition-none"
        [class.opacity-100]="i === active()" [class.scale-100]="i === active()" [class.opacity-0]="i !== active()"
        [class.scale-105]="i !== active()" [style.background-image]="'url(' + slide.image + ')'"
        [attr.aria-hidden]="i !== active()"></div>
    }

    <!-- Background overlay -->
    <div class="absolute inset-0 bg-gradient-to-r from-black/60 via-black/15 to-black/35"></div>

    <!-- Thumbnail navigation -->
    <div class="absolute left-3 top-1/2 z-20 flex -translate-y-1/2 flex-col items-center gap-3 sm:left-6">
        <button type="button" (click)="prev()" aria-label="Previous slide"
            class="grid h-10 w-10 place-items-center rounded-full border border-white/35 bg-white/15 backdrop-blur-md transition hover:bg-white/30 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
            <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="18 15 12 9 6 15" />
            </svg>
        </button>

        <div class="flex flex-col gap-2.5">
            @for (idx of rail(); track slides()[idx].id; let pos = $index) {
            <button type="button" (click)="select(idx)" [attr.aria-label]="'Show ' + slides()[idx].label"
                [attr.aria-current]="idx === active() ? 'true' : null" [class.translate-x-2]="idx === active()"
                [class.border-white]="idx === active()" [class.border-transparent]="idx !== active()"
                [class.opacity-100]="idx === active()" [class.opacity-60]="idx !== active()"
                class="h-[52px] w-[76px] overflow-hidden rounded-xl border-2 bg-neutral-800 p-0 transition duration-300 hover:opacity-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white sm:h-[68px] sm:w-[104px]">
                <img [src]="slides()[idx].image" [alt]="slides()[idx].label" class="block h-full w-full object-cover" />
            </button>
            }
        </div>

        <button type="button" (click)="next()" aria-label="Next slide"
            class="grid h-10 w-10 place-items-center rounded-full border border-white/35 bg-white/15 backdrop-blur-md transition hover:bg-white/30 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
            <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9" />
            </svg>
        </button>
    </div>

    <!-- Active slide button -->
    <div class="pointer-events-none absolute inset-0 z-10 grid place-items-center">
        @for (slide of slides(); track slide.id; let i = $index) {
        <div class="col-start-1 row-start-1 transition-all duration-500 motion-reduce:transition-none"
            [class.pointer-events-auto]="i === active()" [class.translate-y-0]="i === active()"
            [class.opacity-100]="i === active()" [class.translate-y-3]="i !== active()"
            [class.opacity-0]="i !== active()">
            <button type="button" (click)="slide.onClick?.()" [attr.tabindex]="i === active() ? 0 : -1"
                [attr.aria-hidden]="i !== active()"
                class="rounded-full bg-white px-10 py-4 text-lg font-semibold text-neutral-900 transition hover:-translate-y-0.5 hover:shadow-2xl focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
                {{ slide.label }}
            </button>
        </div>
        }
    </div>
</section>
}
